<title>Vida en Pasarela</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..900;1,6..96,500..900&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: app de una columna; arriba los números, al centro un escenario ilustrado con tu personaje, abajo las decisiones. */
:root{
  --bg:#F7F1F8; --surface:#FFFFFF; --ink:#2A1838; --muted:#76627F; --line:#E5D6EA;
  --accent:#C81D6B; --accent-ink:#FFFFFF; --gold:#9A6E0C; --mint:#1C7F67; --soft:#F1DDEC; --soft2:#ECE4F7;
  --shadow:0 10px 30px -14px rgba(60,20,70,.35);
  --display:'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#170E1C; --surface:#23162B; --ink:#F6ECF8; --muted:#B9A3C2; --line:#3A2944;
    --accent:#FF5C9F; --accent-ink:#1A0E1F; --gold:#E7B84B; --mint:#4FD1AE; --soft:#3A2040; --soft2:#2A2142;
    --shadow:0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170E1C; --surface:#23162B; --ink:#F6ECF8; --muted:#B9A3C2; --line:#3A2944;
  --accent:#FF5C9F; --accent-ink:#1A0E1F; --gold:#E7B84B; --mint:#4FD1AE; --soft:#3A2040; --soft2:#2A2142;
  --shadow:0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;gap:6px;align-items:center;padding:10px 16px 6px}
.mono{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;color:var(--accent);margin-right:auto;letter-spacing:-.02em}
.chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.chip svg{width:15px;height:15px}
.chip.money{color:var(--gold)} .chip.mood{color:var(--mint)} .chip.fame{color:var(--accent)}
.chip.neg{color:#D23A3A}
.chip.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}
main{flex:1;overflow-y:auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
main.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s} main.enter>*:nth-child(3){animation-delay:.1s} main.enter>*:nth-child(4){animation-delay:.15s} main.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.9rem;font-style:italic;font-weight:900;letter-spacing:-.02em}
h2{font-size:1.7rem;font-weight:800}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--accent)}
.muted{color:var(--muted)}
p{margin:0}

/* Escenario */
.stage{position:relative;border-radius:26px;height:280px;overflow:hidden;box-shadow:var(--shadow);isolation:isolate}
.stage.sm{height:236px}
.stage.lg{height:330px}
.stage.face{height:340px}.stage.face.sm{height:300px}.stage.face.lg{height:380px}
.stage.face .fig{top:16px;bottom:0;align-items:flex-end}
.stage.face .fig svg{filter:drop-shadow(0 10px 18px rgba(30,10,40,.35))}
.av .breathe-p{animation:breathe2 5s ease-in-out infinite;transform-origin:150px 362px}
@keyframes breathe2{50%{transform:translateY(-1.2px) scale(1.004)}}
.zooms{position:absolute;left:10px;top:12px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:2}
.zooms span{width:64px;height:64px;border-radius:16px;overflow:hidden;background:#fff;border:2.5px solid #fff;box-shadow:0 6px 16px -6px rgba(30,10,40,.5)}
.zooms svg{width:100%;height:100%;display:block}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .fig{position:absolute;left:0;right:0;top:10px;bottom:2px;display:flex;justify-content:center;pointer-events:none}
.stage .fig svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 6px 8px rgba(30,10,40,.25))}
.stage.pop .fig{animation:popfig .6s ease}
@keyframes popfig{30%{transform:scale(1.04)}}
.stage .shine{position:absolute;inset:0;pointer-events:none}
.av .breathe{animation:breathe 4.5s ease-in-out infinite;transform-origin:100px 390px}
@keyframes breathe{50%{transform:scaleY(1.008) translateY(-.6px)}}
.av .eyes{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.bg .tw{animation:tw 2.4s ease-in-out infinite}
.bg .tw:nth-of-type(3n){animation-delay:.8s} .bg .tw:nth-of-type(3n+1){animation-delay:1.6s}
@keyframes tw{50%{opacity:.35}}
.bg .flash{opacity:0;animation:flash 3.2s infinite}
@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:1}94%{opacity:0}}
.bg .beam{animation:sway 6s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}
@keyframes sway{50%{transform:rotate(6deg)}}

/* Historia */
.say{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.say .face{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.say .face .pic{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid var(--accent)}
.say .face .pic svg{width:100%;height:100%;display:block}
.say .face span{font-size:11px;font-weight:900;text-align:center;line-height:1.1;color:var(--accent)}
.say p{min-width:0}
.story{font-size:1.06rem;max-width:65ch}
.story b{color:var(--accent)}
.notice{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700}
.choices,.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:900;text-align:left;cursor:pointer;transition:transform .1s ease,border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--accent)}
.btn .note{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#7a2bd6));color:var(--accent-ink);border-color:transparent;text-align:center;font-size:1.06rem}
.btn.primary .note{color:var(--accent-ink);opacity:.85}
.btn.ghost{background:transparent;text-align:center;box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ico{display:flex;gap:12px;align-items:center}
.btn.ico .ic{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.btn.ico .ic svg{width:34px;height:34px}
.btn:focus-visible,.item:focus-visible,.tab:focus-visible,.card:focus-visible,.tile:focus-visible,.swatch:focus-visible,.seg button:focus-visible,.vid button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pips{display:flex;gap:6px;align-items:center;font-weight:900;font-size:14px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pip.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
label.lbl,.lbl{font-weight:900;font-size:14px}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--accent);outline-offset:1px}
.skins{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--accent)}

/* Vestidor */
.banner{background:linear-gradient(135deg,#2A1838,#5B1E52);color:#FCEFF7;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.banner .eyebrow{color:#FFB3D3}
.banner strong{font-family:var(--display);font-size:1.4rem;font-style:italic}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex-shrink:0;font:inherit;font-weight:900;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.item{font:inherit;color:var(--ink);border-radius:18px;border:1.5px solid var(--line);background:var(--surface);padding:8px 8px 10px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;cursor:pointer;min-width:0;box-shadow:var(--shadow);transition:transform .1s}
.item:active{transform:scale(.97)}
.item.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.item .th{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;background:radial-gradient(circle at 50% 40%,var(--surface),var(--soft2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .th svg{width:92%;height:92%}
.item .nm{font-weight:900;font-size:13px;line-height:1.2}
.item .pr{font-weight:900;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tag{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:6px;background:var(--soft2);color:var(--muted)}
.tag.hit{background:var(--accent);color:var(--accent-ink)}
.buybar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.empty{padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-weight:700}

/* Resultados */
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:46px;height:46px;animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}.stars svg:nth-child(4){animation-delay:.45s}.stars svg:nth-child(5){animation-delay:.6s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.fb{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.verdict{font-family:var(--display);font-style:italic;font-size:1.6rem;font-weight:800;text-align:center}

/* Puzzles */
.ptop{display:flex;justify-content:space-between;font-weight:900;font-variant-numeric:tabular-nums}
.timer{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#9B5CF6);transition:width 1s linear}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:600px}
.card{aspect-ratio:3/4;max-width:100%;border-radius:14px;border:0;padding:0;cursor:pointer;position:relative;background:transparent;transform-style:preserve-3d;transition:transform .35s}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center}
.card .b{background:radial-gradient(circle at 50% 50%,#FF8CC0 0 18%,transparent 19%),repeating-linear-gradient(45deg,#C81D6B 0 7px,#A3155A 7px 14px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.card .b::after{content:"VP";font-family:var(--display);font-style:italic;font-weight:900;color:#fff;font-size:15px}
.card .f{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);transform:rotateY(180deg)}
.card .f svg{width:76%;height:76%}
.card.up{transform:rotateY(180deg)}
.card.done .f{background:color-mix(in srgb,var(--mint) 18%,var(--surface));box-shadow:inset 0 0 0 2px var(--mint)}
.slots,.letters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile{width:40px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:900;font-size:1.45rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile.slot{background:var(--soft2);border-style:dashed;box-shadow:none}
.tile.slot.full{background:var(--surface);border-style:solid;border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.tile.used{opacity:.2}
.slots.ok .tile{border-color:var(--mint);color:var(--mint);box-shadow:0 3px 0 var(--mint)}
.slots.bad{animation:shake .4s}
.slots.bad .tile{border-color:#D23A3A;color:#D23A3A}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border-radius:22px;background:linear-gradient(#3B1E4A,#24122E);box-shadow:inset 0 0 0 4px #D9A93A,var(--shadow)}
.vid button{aspect-ratio:1;max-width:100%;border-radius:16px;border:0;background:rgba(255,255,255,.08);cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;display:grid;place-items:center}
.vid button svg{width:70%;height:70%}
.vid button.lit{background:#FFE7F2;transform:scale(1.07);box-shadow:0 0 24px #FF8CC0}
.vid button:disabled{cursor:default}
.big{font-family:var(--display);font-size:3rem;font-weight:900;font-style:italic;color:var(--gold)}
.center{text-align:center;align-items:center}
.ending{background:linear-gradient(150deg,#2A1838,#6B1E55 60%,#B5245F);color:#FCEFF7;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ending h2{font-style:italic;font-size:2.2rem}
.ending .eyebrow{color:#FFB3D3}
.tiny{font-size:13px}
.linkbtn{font:inherit;font-weight:700;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px;align-self:center}

/* Capas */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:900;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#chcard{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,#5B1E52,#1A0E22 70%);color:#FCEFF7;text-align:center;padding:24px 16px;cursor:pointer;animation:chin .5s ease both}
#chcard.out{animation:chout .5s ease both}
#chcard .n{font-family:var(--display);font-style:italic;font-weight:900;font-size:5.5rem;line-height:1;color:#FF8CC0}
#chcard .t{font-family:var(--display);font-size:2rem;font-weight:800;max-width:14ch;text-wrap:balance}
#chcard .eyebrow{color:#FFB3D3}
@keyframes chin{from{opacity:0;transform:scale(1.05)}}
@keyframes chout{to{opacity:0;visibility:hidden}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="app">
  <header id="stats"></header>
  <main id="main"></main>
</div>
<canvas id="fx"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  ['hc_castano','hairColor','c','Castaño','#5A3825',0,[]],

  ['hc_rojo','hairColor','c','Colorado','#B4412C',80,[]],
  ['hc_rosa','hairColor','c','Rosa','#F08AB5',90,[]],

  ['ec_marron','eyeColor','c','Ojos marrones','#6B4426',0,[]],
  ['ec_avellana','eyeColor','c','Lentes avellana','#9A7A3A',30,[]],
  ['ec_verde','eyeColor','c','Lentes verdes','#3E8A5A',35,[]],
  ['ec_azul','eyeColor','c','Lentes azules','#3F86C4',35,[]],
  ['ec_gris','eyeColor','c','Lentes grises','#7E8B98',35,[]],
  ['ec_violeta','eyeColor','c','Lentes violetas','#8A5CC8',45,['fiesta']],

function scoreOutfit(themes){
  const w = S.wear, good = [], bad = [];
  let pts = 0;
  const check = (id, val) => { if(!id) return; const it=IT[id]; if(it.shape==='none') return; if(it.tags.some(t=>themes.includes(t))){ pts+=val; good.push(it.name); } else bad.push(it.name); };
  if(w.dress) check(w.dress,6); else { check(w.top,3); check(w.bottom,3); }
  check(w.shoes,2); check(w.acc,2); check(w.lips,1); check(w.eyes,1); check(w.hair,1);
  const stars = Math.max(1, Math.min(5, Math.round(pts/13*5)));
  return {stars, good, bad};
}

  if(p==='marca' && S.fame>=9) return {t:'Tu propia marca', d:`La línea de ${N()} ya se vende en tres países. Lo que empezó con una valija casi vacía hoy es una marca con tu nombre.`};
  if(p==='influencer' && S.fame>=9) return {t:'Ícono de las redes', d:`Millones de personas esperan tu próximo look. Las marcas te mandan ropa antes de que salga a la venta.`};
  if(p==='asistente' && (f.valentina || f.escuela)) return {t:'Directora creativa', d:`Valentina Roux se retira y te deja al frente de su casa de moda. Nadie lo duda: te lo ganaste.`};
  if(S.money>=1500) return {t:'Éxito en los negocios', d:`Supiste manejar la plata como nadie. Hoy tenés tu propio local y una cuenta bancaria que da envidia.`};
  if(S.mood>=8) return {t:'Una vida feliz', d:`Quizás no sos la persona más famosa de la ciudad, pero tenés gente que te quiere y te levantás con ganas cada mañana.`};
  if(S.fame>=8) return {t:'Cara conocida', d:`Te reconocen por la calle y te invitan a todos los eventos. El próximo paso depende de vos.`};
  return {t:'Esto recién empieza', d:`Todavía no llegaste a la cima, pero aprendiste muchísimo. La ciudad sigue ahí, esperando tu próximo movimiento.`};
}

function newChapter(n){
  S.chapter = n; S.energy = MAXE;
  const pay = JOBS[S.job]?.pay||0, rent = HOMES[S.home]?.rent||0;
  S.money += pay - rent;
  if(S.flags.escuela) S.fame += 1;
  S.notice = `${pay?`Cobraste $${pay}`:'Este capítulo no cobraste sueldo'}${rent?` y pagaste $${rent} de alquiler`:''}.${S.flags.escuela?' Tus profes de diseño te recomiendan: +1 fama.':''} Tu energía se recargó.`;
  bumpKeys.push('money');
  chapterCard(n);
}
function enterScene(id){
  if(id==='final'){ S.scene='final'; S.done=true; return; }
  const sc = SCENES[id];
  if(sc.ch > S.chapter) newChapter(sc.ch);
  S.scene = id;
}
function goScene(target){
  if(target.startsWith('HUB:')){ S.pending = target.slice(4); S.scene = 'hub'; }
  else enterScene(target);
  view = null; save(); render(); scrollTop();
}

function confetti(n=140){
  if(REDUCED) return;
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#FF5C9F','#E2B347','#9B5CF6','#4FD1AE','#FFFFFF','#FF8CC0'];
  const ps = Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80, y:H*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*10-3, r:Math.random()*6+3, c:cols[Math.random()*cols.length|0], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  let t0 = performance.now();
  (function f(t){
    const k = (t-t0)/1000; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.25; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-k/3); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(k<3) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H);
  })(t0);
}
function sparkleAt(el){
  if(REDUCED || !el) return;
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight; const b = el.getBoundingClientRect();
  const cx = b.left+b.width/2, cy = b.top+b.height/2;
  const ps = Array.from({length:26},(_,i)=>({a:i/26*Math.PI*2, d:0, s:2+Math.random()*3, c:i%2?'#E2B347':'#FF8CC0'}));
  let t0 = performance.now();
  (function f(t){
    const k = (t-t0)/700; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ const d = k*b.width*.55; const x=cx+Math.cos(p.a)*d, y=cy+Math.sin(p.a)*d*.8; ctx.globalAlpha=Math.max(0,1-k); ctx.fillStyle=p.c; ctx.beginPath(); ctx.moveTo(x,y-p.s*2); ctx.lineTo(x+p.s*.6,y); ctx.lineTo(x,y+p.s*2); ctx.lineTo(x-p.s*.6,y); ctx.closePath(); ctx.fill(); });
    if(k<1) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H);
  })(t0);
}

function clearP(){ if(!P) return; clearInterval(P.timer); (P.tos||[]).forEach(clearTimeout); }
function later(fn,ms){ const t=setTimeout(fn,ms); P.tos.push(t); }
function tick(){ P.timer=setInterval(()=>{ if(P.over) return; P.time--; if(P.time<=0){ P.time=0; endPuzzle(); } else updTimer(); },1000); }
function updTimer(){ const t=document.querySelector('.timer'); if(t) t.textContent=P.time+' s'; const b=document.querySelector('.bar i'); if(b) b.style.width=(P.time/P.total*100)+'%'; }

function startPuzzle(k){
  if(S.energy<=0) return;
  S.energy--; save();
  if(k==='memoria'){
    const pool = shuffle(ICONS).slice(0,6);
    P = {k, cards:shuffle([...pool,...pool]).map(e=>({e,open:false,done:false})), first:null, lock:false, time:45, total:45, matched:0, tos:[]};
    tick();
  }
  if(k==='palabras'){
    P = {k, words:shuffle(WORDS).slice(0,5), idx:0, time:75, total:75, earned:0, solved:0, tos:[]};
    setWord(); tick();
  }
  if(k==='vidriera'){
    P = {k, len:3, seq:[], input:[], phase:'show', lit:-1, rounds:0, earned:0, tos:[]};
    later(newRound,600);
  }
  view='puzzle'; render(); scrollTop();
}
function setWord(){
  const w = P.words[P.idx]; let mix;
  do { mix = shuffle(w.split('')); } while(mix.join('')===w);
  P.letters = mix.map(ch=>({ch,used:false})); P.picked=[]; P.flash=null;
}
function newRound(){
  P.seq = Array.from({length:P.len},()=>Math.floor(Math.random()*6)); P.input=[]; P.phase='show'; render();
  P.seq.forEach((v,k)=>{ later(()=>{P.lit=v;render();}, 300+k*750); later(()=>{P.lit=-1;render();}, 300+k*750+520); });
  later(()=>{P.phase='input';render();}, 300+P.seq.length*750);
}
function endPuzzle(){
  if(!P || P.over) return;
  clearP();
  let pay = 0;
  if(P.k==='memoria') pay = P.matched*12 + (P.matched===6 ? P.time*2 : 0);
  if(P.k==='palabras') pay = P.earned + (P.solved===P.words.length ? P.time : 0);
  if(P.k==='vidriera') pay = P.earned;
  pay = Math.min(pay, P.k==='memoria'?130:P.k==='palabras'?200:250);
  P.over = true; P.pay = pay; S.money += pay; if(pay) bumpKeys.push('money'); save(); render();
  if(pay>=100) confetti(90);
}
function rPuzzle(){
  const meta = PUZ[P.k];
  if(P.over) return `<div class="stack center" style="padding-top:20px"><div class="eyebrow">${meta.name}</div><div style="width:96px;height:96px">${icon('moneda')}</div>
    <div class="big">+$${P.pay}</div><p class="muted">${P.pay>=100?'¡Excelente trabajo!':P.pay>0?'Bien ahí, sumaste algo de plata.':'Esta vez no salió. ¡La próxima seguro!'}</p></div>
    <button class="btn primary" data-act="puzBack">Volver</button>`;
  let body = '';
  const bar = P.total ? `<div class="bar"><i style="width:${P.time/P.total*100}%"></i></div>` : '';
  if(P.k==='memoria') body = `<div class="ptop"><span>Parejas ${P.matched}/6</span><span class="timer">${P.time} s</span></div>${bar}
    <div class="mem">${P.cards.map((c,i)=>`<button class="card ${c.open||c.done?'up':''} ${c.done?'done':''}" data-act="mem" data-v="${i}" aria-label="Carta ${i+1}"><span class="b"></span><span class="f">${icon(c.e)}</span></button>`).join('')}</div>`;
  if(P.k==='palabras'){
    const w = P.words[P.idx];
    body = `<div class="ptop"><span>Palabra ${P.idx+1}/${P.words.length} · $${P.earned}</span><span class="timer">${P.time} s</span></div>${bar}
      <div class="slots ${P.flash||''}">${w.split('').map((_,i)=>{const pi=P.picked[i];return pi!==undefined?`<button class="tile slot full" data-act="wp" data-v="${i}">${P.letters[pi].ch}</button>`:`<span class="tile slot"></span>`;}).join('')}</div>
      <div class="letters">${P.letters.map((l,i)=>`<button class="tile ${l.used?'used':''}" data-act="wl" data-v="${i}" ${l.used?'disabled':''}>${l.ch}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-act="wclear">Borrar</button><button class="btn ghost" data-act="wskip">Saltar</button></div>`;
  }
  if(P.k==='vidriera') body = `<div class="ptop"><span>${P.phase==='show'?'Mirá la vidriera…':P.phase==='input'?`Repetí el orden: ${P.input.length}/${P.seq.length}`:'…'}</span><span>$${P.earned}</span></div>
    <div class="vid">${ICONS.slice(0,6).map((e,i)=>`<button class="${P.lit===i?'lit':''}" data-act="vid" data-v="${i}" ${P.phase==='input'?'':'disabled'} aria-label="Prenda ${i+1}">${icon(e)}</button>`).join('')}</div>
    <p class="muted tiny">Ronda de ${P.len} prendas. Cada ronda que acertás suma más plata.</p>`;
  return `<div class="eyebrow">Trabajo extra</div><h2>${meta.name}</h2>${body}<button class="linkbtn" data-act="puzQuit">Terminar y cobrar lo que llevo</button>`;
}

/* ---------- Render y acciones ---------- */
function render(){
  rStats();
  const m = document.getElementById('main');
  let html, key;
  if(view==='puzzle' && P){ html = rPuzzle(); key = 'pz'+P.k+(P.over?'o':''); }
  else if(view==='puzzles'){ html = rPuzzles(); key='pzs'; }
  else if(view==='closet' || S.scene==='event'){ html = rCloset(); key='closet'; }
  else if(S.scene==='setup'){ html = rSetup(); key='setup'; }
  else if(S.scene==='hub'){ html = rHub(); key='hub'; }
  else if(S.scene==='result'){ html = rResult(); key='result'; }
  else if(S.scene==='final'){ html = rFinal(); key='final'; }
  else { html = rStory(); key=S.scene; }
  m.innerHTML = html;
  if(key!==lastKey){ m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); lastKey=key; }
  else m.classList.remove('enter');
  ui.pop = false;
}

const ACT = {
  skin:v=>{ S.skin=+v; document.querySelectorAll('.swatch').forEach((b,i)=>b.classList.toggle('on',i===S.skin)); document.getElementById('prev').innerHTML=stage(null,'city','sm'); },
  start:()=>{ if(!S.name.trim()) return; S.name=S.name.trim(); enterScene('c1_llegada'); save(); render(); scrollTop(); chapterCard(1); },
  choice:v=>{
    const c = SCENES[S.scene].choices()[+v]; if(c.req && !c.req()) return;
    S.notice = null; applyFx(c.fx); c.set && c.set();
    if(c.event){ S.event=c.event; S.scene='event'; ui.tryOn=null; ui.mode='mine'; ui.tab='ropa'; save(); render(); scrollTop(); return; }
    goScene(c.go);
  },
  cont:()=>{ S.notice=null; const p=S.pending; S.pending=null; goScene(p); },
  view:v=>{ view=v; ui.tryOn=null; ui.mode='mine'; render(); scrollTop(); },
  back:()=>{ view=null; ui.tryOn=null; render(); scrollTop(); },
  tab:v=>{ ui.tab=v; ui.tryOn=null; render(); },
  mode:v=>{ ui.mode=v; ui.tryOn=null; render(); },
  item:v=>{
    const it = IT[v];
    if(S.owned.includes(v)){ applyWear(S.wear,it); ui.tryOn=null; save(); }
    else ui.tryOn = ui.tryOn===v ? null : v;
    ui.pop = true; render();
  },
  buy:()=>{
    const it = IT[ui.tryOn]; if(!it) return; const p = price(it);
    if(S.money < p) return;
    S.money -= p; S.owned.push(it.id); applyWear(S.wear,it); ui.tryOn=null; bumpKeys.push('money'); save();
    toast(`Compraste ${it.name} · −$${p}`); ui.pop = true; render();
    sparkleAt(document.querySelector('.stage'));
  },
  ready:()=>{
    const ev = EVENTS[S.event]; const sc = scoreOutfit(ev.themes); const r = ev.result(sc.stars);
    applyFx(r.fx);
    S.result = {title:ev.title, bg:ev.bg, stars:sc.stars, good:sc.good, bad:sc.bad, text:r.text, next:ev.next};
    S.scene='result'; S.event=null; ui.tryOn=null; view=null; save(); render(); scrollTop();
    if(sc.stars>=4) setTimeout(()=>confetti(), 650);
  },
  resultNext:()=>{ const n=S.result.next; S.result=null; goScene(n); },
  puz:v=>startPuzzle(v),
  puzQuit:()=>endPuzzle(),
  puzBack:()=>{ P=null; view='puzzles'; render(); scrollTop(); },
  mem:v=>{
    const i=+v, c=P.cards[i]; if(P.over||P.lock||c.open||c.done) return;
    c.open=true;
    if(P.first===null){ P.first=i; render(); return; }
    const a=P.cards[P.first]; P.first=null;
    if(a.e===c.e){ P.lock=true; render(); later(()=>{ a.done=c.done=true; P.matched++; P.lock=false; render(); if(P.matched===6) later(endPuzzle,500); },380); }
    else { P.lock=true; render(); later(()=>{ a.open=c.open=false; P.lock=false; render(); },850); }
  },
  wl:v=>{
    const w=P.words[P.idx], l=P.letters[+v]; if(P.over||l.used||P.flash) return;
    l.used=true; P.picked.push(+v);
    if(P.picked.length===w.length){
      const guess = P.picked.map(i=>P.letters[i].ch).join('');
      if(guess===w){ P.flash='ok'; P.solved++; P.earned+=30; render(); later(nextWord,650); }
      else { P.flash='bad'; render(); later(()=>{ P.letters.forEach(x=>x.used=false); P.picked=[]; P.flash=null; render(); },600); }
    } else render();
  },
  wp:v=>{ if(P.flash) return; const removed=P.picked.splice(+v); removed.forEach(pi=>P.letters[pi].used=false); render(); },
  wclear:()=>{ if(P.flash) return; P.letters.forEach(x=>x.used=false); P.picked=[]; render(); },
  wskip:()=>{ if(P.flash) return; nextWord(); },
  vid:v=>{
    if(P.phase!=='input') return; const i=+v;
    if(P.seq[P.input.length]===i){
      P.input.push(i); P.lit=i; render(); later(()=>{P.lit=-1;render();},200);
      if(P.input.length===P.seq.length){ P.phase='wait'; P.rounds++; P.earned+=P.len*10; P.len++; toast(`¡Bien! +$${(P.len-1)*10}`); if(P.len>7) later(endPuzzle,500); else later(newRound,900); }
    } else { P.phase='wait'; toast('¡Uy! Ese no era'); later(endPuzzle,700); }
  },
  sleep:()=>{ S.energy=MAXE; S.mood=Math.min(10,S.mood+1); bumpKeys.push('mood'); save(); toast('Día nuevo · energía al máximo'); render(); },
  showEnd:()=>{ S.scene='final'; save(); render(); scrollTop(); },
  free:()=>{ S.scene='hub'; S.pending=null; save(); render(); scrollTop(); },
  reset:()=>{ ui.resetAsk=true; render(); },
  resetNo:()=>{ ui.resetAsk=false; render(); },
  resetYes:()=>{ clearP(); P=null; view=null; ui={tab:'ropa',mode:'mine',tryOn:null,resetAsk:false,pop:false}; S=fresh(); save(); render(); scrollTop(); },
};
function nextWord(){ P.idx++; if(P.idx>=P.words.length) endPuzzle(); else { setWord(); render(); } }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  ACT[b.dataset.act]?.(b.dataset.v, b);
});
document.addEventListener('input', e=>{
  if(e.target.id==='nombre'){ S.name=e.target.value; const sb=document.getElementById('startBtn'); if(sb) sb.disabled=!S.name.trim(); }
});

function boot(data){
  S = (data && data.S) ? Object.assign(fresh(), data.S) : (load() || fresh());
  if(!IT[S.wear.hairColor]) S.wear.hairColor = 'hc_castano';
  if(!S.wear.eyeColor) S.wear.eyeColor = 'ec_marron';
  if(!S.owned.includes('ec_marron')) S.owned.push('ec_marron');
  render();
}
try { window.claude?.hot?.snapshot?.(()=>({S})); } catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
